<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xem Một Lát - Kết nối TikTok</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a href="index.html">Trang chủ</a><a href="post.html">Post to TikTok</a><a href="terms.html">Điều khoản</a><a href="privacy.html">Quyền riêng tư</a></nav>
<h1>Kết nối TikTok</h1>
<p id="msg">Đang chuyển về trang đăng bài…</p>
<script>
(function(){
var p=new URLSearchParams(location.search),m=document.getElementById('msg');
var q=new URLSearchParams();
if(p.get('code')){q.set('code',p.get('code'));q.set('state',p.get('state')||'');}
else if(p.get('error')){q.set('auth_error',p.get('error_description')||p.get('error'));}
else{m.textContent='Trang này nhận kết quả đăng nhập TikTok. Hãy bắt đầu từ trang Post to TikTok.';return;}
location.replace('post.html?'+q.toString());
})();
</script>
